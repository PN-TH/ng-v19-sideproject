<h1 class="text-3xl font-bold text-center mt-6 text-gray-800">Liste des Pokémon</h1>
<div class="p-4">
  <pokemon-search (searchQueryChange)="search($event)"></pokemon-search>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
  @for (pokemon of pokemons(); track pokemon.id) {
    <pokemon-card [pokemon]="pokemon"></pokemon-card>
  }
</div>
