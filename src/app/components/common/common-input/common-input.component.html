<div class="flex flex-col gap-2">
  @if (label) {
    <label class="text-sm font-medium">{{ label }}</label>
  }

  <div class="relative flex items-center">
    @if (icon) {
      <span class="absolute left-3 text-gray-500">
        <i [class]="icon"></i>
      </span>
    }

    <input
      [attr.type]="inputProps.type || 'text'"
      [attr.placeholder]="inputProps.placeholder"
      [attr.disabled]="disabled || inputProps.disabled"
      [value]="value"
      (input)="onInputChange($event)"
      class="border rounded-md px-3 py-2 w-full"
    />

    @if (isLoading) {
      <div
        class="absolute right-3 animate-spin border-2 border-gray-500 border-t-transparent rounded-full w-5 h-5"
      ></div>
    }
  </div>
</div>
